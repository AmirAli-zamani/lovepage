<section class="chapter atmosphere-{{ chapter.atmosphere }}" id="{{ chapter.id }}" aria-labelledby="title-{{ chapter.id }}"><div class="chapter-glow" aria-hidden="true"></div><div class="chapter-inner"><p class="eyebrow reveal">{{ chapter.kicker }}</p><h2 class="reveal" id="title-{{ chapter.id }}">{{ chapter.title|linebreaksbr }}</h2><div class="chapter-rule reveal" aria-hidden="true">✧</div><div class="prose">{% for paragraph in chapter.paragraphs %}<p class="reveal">{{ paragraph }}</p>{% endfor %}</div><blockquote class="reveal">{{ chapter.whisper }}</blockquote><p class="handwritten reveal">{{ chapter.note }}</p>{% if forloop.last %}<div class="ending reveal"><span class="infinity" aria-label="Infinity">∞</span><p>{{ letter.closing }}</p><p class="handwritten">{{ letter.signature }}</p></div>{% endif %}</div><span class="chapter-page" aria-hidden="true">0{{ forloop.counter }} / 05</span></section>
